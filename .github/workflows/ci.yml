name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the older, still-running build.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  client:
    name: Client (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests (Jest)
        run: npm test -- --ci --runInBand

      - name: Build
        run: npm run build

  server:
    name: Server (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      # This is the "TypeScript testing" gate: full strict type check, no emit.
      # The client is plain JS/JSX, so it has no equivalent step.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (node:test)
        run: npm test

      - name: Build
        run: npm run build

  # Single required check to point branch protection at, so adding a job later
  # does not mean re-editing the protected-branch rule.
  ci:
    name: CI
    if: always()
    needs: [client, server]
    runs-on: ubuntu-latest
    steps:
      - name: Verify both halves succeeded
        run: |
          echo "client: ${{ needs.client.result }}"
          echo "server: ${{ needs.server.result }}"
          [ "${{ needs.client.result }}" = "success" ] \
            && [ "${{ needs.server.result }}" = "success" ]
